<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HEPR Three.js Example</title>
    <link rel="stylesheet" href="/src/package-version.css" />
    <link rel="stylesheet" href="/src/drawingSelectionControls.css" />
    <link rel="stylesheet" href="/src/pdfLayerControls.css" />
    <link rel="stylesheet" href="/src/pdfPasswordPrompt.css" />
    <style>
      :root {
        color-scheme: light;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: #11161d;
        color: #e8edf5;
      }

      #app {
        position: fixed;
        inset: 0;
      }

      #viewport {
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
        cursor: grab;
      }

      #viewport:active {
        cursor: grabbing;
      }

      #panel {
        position: fixed;
        max-height: calc(100vh - 50px);
	      overflow-y: auto;
        top: 16px;
        left: 16px;
        width: min(620px, calc(100vw - 32px));
        background: rgba(13, 18, 26, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 10px;
        padding: 12px;
        box-sizing: border-box;
        backdrop-filter: blur(8px);
        z-index: 2;
      }

      #panel.collapsed {
        width: auto;
        max-width: calc(100vw - 32px);
      }

      #panel.collapsed .panel-content {
        display: none;
      }

      .panel-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 10px;
      }

      .panel-content {
        margin-top: 8px;
      }

      .row,
      .toolbar,
      .toggles,
      .number-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
      }

      .row:last-child,
      .number-row:last-child {
        margin-bottom: 0;
      }

      select,
      button,
      input {
        font: inherit;
      }

      .toolbar,
      .toggles {
        flex-wrap: wrap;
      }

      .panel-header .toolbar {
        margin-bottom: 0;
      }

      select,
      button {
        background: #162030;
        color: #e8edf5;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 6px;
        padding: 7px 10px;
      }

      button {
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.6;
        cursor: default;
      }

      .chevron-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 30px;
        min-width: 30px;
        height: 30px;
        padding: 0;
        line-height: 1;
      }

      .toggle {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        user-select: none;
      }

      .toggle input {
        margin: 0;
      }

      .number-row {
        display: grid;
        grid-template-columns: max-content minmax(110px, 1fr);
        font-size: 13px;
      }

      .number-row select {
        width: min(220px, 100%);
      }

      .number-row input[type="color"] {
        width: 44px;
        height: 28px;
        padding: 0;
        border-radius: 6px;
      }

      .color-controls {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
      }

      .color-controls input[type="number"] {
        width: 64px;
        min-width: 0;
      }

      .color-controls input[type="range"] {
        width: min(180px, 22vw);
      }

      .color-suffix {
        color: rgba(232, 237, 245, 0.66);
        font-size: 12px;
      }

      #status {
        font-size: 13px;
        opacity: 0.92;
      }

      .meter-row {
        justify-content: space-between;
        font-size: 13px;
        color: rgba(232, 237, 245, 0.88);
      }

      .meter-label {
        color: rgba(232, 237, 245, 0.66);
      }

      .meter-value {
        font-variant-numeric: tabular-nums;
      }

      #parse-loader {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        opacity: 0.94;
      }

      #parse-loader[hidden] {
        display: none !important;
      }

      #drop-indicator {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        pointer-events: none;
        opacity: 0;
        background: transparent;
        color: #e8edf5;
        font-size: clamp(1.1rem, 2.2vw, 1.6rem);
        font-weight: 600;
        text-shadow: 0 1px 10px rgba(0, 0, 0, 0.5);
        transition: opacity 120ms ease-out;
      }

      #drop-indicator.active {
        opacity: 1;
      }

      #drop-indicator.dragging {
        background: rgba(10, 22, 40, 0.5);
      }

      .row[hidden] {
        display: none !important;
      }

      .toggle[hidden] {
        display: none !important;
      }

      .example-dropdown {
        position: relative;
      }

      .example-trigger {
        display: inline-flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        min-width: 190px;
        max-width: 100%;
        cursor: pointer;
        transition: border-color 120ms ease, box-shadow 120ms ease, background 120ms ease;
      }

      .example-trigger:hover:not(:disabled) {
        background: #1d2a3e;
        border-color: rgba(255, 255, 255, 0.32);
      }

      .example-trigger:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .example-dropdown.open .example-trigger {
        border-color: rgba(96, 165, 250, 0.7);
        box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.18);
      }

      .example-trigger-label {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .example-trigger-count {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 20px;
        height: 20px;
        padding: 0 6px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.12);
        color: rgba(232, 237, 245, 0.85);
        font-size: 12px;
        font-weight: 600;
        line-height: 1;
      }

      .example-trigger-chevron {
        color: rgba(232, 237, 245, 0.6);
        font-size: 12px;
        line-height: 1;
        transition: transform 140ms ease;
      }

      .example-dropdown.open .example-trigger-chevron {
        transform: rotate(180deg);
      }

      .example-menu {
        position: fixed;
        z-index: 40;
        width: max-content;
        max-width: min(460px, calc(100vw - 32px));
        padding: 6px;
        overflow-y: auto;
        background: rgba(19, 26, 38, 0.97);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 12px;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(8px);
        outline: none;
        animation: menu-pop 120ms ease-out;
      }

      .example-menu[hidden] {
        display: none;
      }

      @keyframes menu-pop {
        from {
          opacity: 0;
          transform: translateY(-4px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .example-menu-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 6px 10px;
        border-radius: 8px;
      }

      .example-menu-row:hover {
        background: rgba(255, 255, 255, 0.06);
      }

      .example-menu-name {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: #e8edf5;
        font-size: 13px;
      }

      .example-menu-actions {
        display: inline-flex;
        flex-shrink: 0;
        gap: 6px;
      }

      .example-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        background: rgba(255, 255, 255, 0.04);
        color: #e8edf5;
        border-radius: 999px;
        padding: 3px 10px;
        font-size: 12px;
        line-height: 1.3;
        cursor: pointer;
        transition: background 100ms ease, color 100ms ease, border-color 100ms ease;
      }

      .example-chip:hover,
      .example-chip:focus-visible {
        background: #e8edf5;
        border-color: #e8edf5;
        color: #11161d;
      }

      .example-chip-kind {
        font-weight: 600;
      }

      .example-chip-size {
        color: rgba(232, 237, 245, 0.55);
        font-family: "Cascadia Mono", "Consolas", monospace;
        font-size: 11px;
      }

      .example-chip:hover .example-chip-size,
      .example-chip:focus-visible .example-chip-size {
        color: rgba(17, 22, 29, 0.65);
      }

      .search-row {
        grid-template-columns: max-content 1fr;
      }

      .search-controls {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
      }

      .search-controls input[type="search"] {
        flex: 1;
        min-width: 0;
        background: #162030;
        color: #e8edf5;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 6px;
        padding: 6px 8px;
      }

      .search-controls input[type="search"]:disabled {
        opacity: 0.6;
      }

      .search-count {
        flex-shrink: 0;
        min-width: 3.2em;
        text-align: right;
        color: rgba(232, 237, 245, 0.66);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }

      .search-count[hidden] {
        display: none;
      }

      .search-controls button {
        width: 32px;
        min-width: 32px;
        padding: 6px 0;
        font-size: 12px;
      }

      #text-search-case[aria-pressed="true"],
      .page-layout-buttons button[aria-pressed="true"] {
        background: #e8edf5;
        border-color: #e8edf5;
        color: #11161d;
      }

      .number-row[hidden] {
        display: none !important;
      }

      .page-layout-controls {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
      }

      .page-layout-buttons {
        display: flex;
        gap: 6px;
      }

      .page-layout-progress {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: rgba(232, 237, 245, 0.8);
        font-variant-numeric: tabular-nums;
      }

      .page-layout-progress[hidden] {
        display: none;
      }

      .page-layout-progress progress {
        width: 90px;
        height: 6px;
        border: none;
        border-radius: 3px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.14);
        appearance: none;
      }

      .page-layout-progress progress::-webkit-progress-bar {
        background: rgba(255, 255, 255, 0.14);
      }

      .page-layout-progress progress::-webkit-progress-value {
        background: #60a5fa;
      }

      .page-layout-progress progress::-moz-progress-bar {
        background: #60a5fa;
      }

      .page-layout-buttons button {
        padding: 5px 12px;
        font-size: 13px;
      }

      .loader-spinner {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        border: 2px solid rgba(232, 237, 245, 0.25);
        border-top-color: #e8edf5;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="viewport"></canvas>
    </div>

    <div id="panel" role="group" aria-label="Three.js HEPR controls">
      <div class="panel-header">
        <div class="toolbar">
          <a class="package-version" href="https://www.npmjs.com/package/@soadzoor/hepr" target="_blank" rel="noopener noreferrer" title="HEPR package version used by this build">npm v%HEPR_PACKAGE_VERSION%</a>
          <button id="open-file" type="button" title="Open a PDF or HEPR-exported .hep file">Open PDF / HEP</button>
          <div id="example-dropdown" class="example-dropdown">
            <button id="example-select" class="example-trigger" type="button" aria-label="Load example PDF or HEP file" aria-haspopup="true" aria-expanded="false" aria-controls="example-menu" disabled>
              <span id="example-select-label" class="example-trigger-label">Examples (loading...)</span>
              <span class="example-trigger-chevron" aria-hidden="true">▾</span>
            </button>
            <div id="example-menu" class="example-menu" hidden></div>
          </div>
          <button id="download-data" type="button" hidden disabled>Download HEP</button>
          <button id="download-pdf" type="button" hidden disabled>Download PDF</button>
          <input id="file-input" type="file" accept=".pdf,.hep,application/pdf,application/x-hep" hidden />
        </div>
        <button id="toggle-panel" class="chevron-button" type="button" aria-expanded="true" aria-controls="panel-content" title="Collapse panel">
          <span id="toggle-panel-icon" aria-hidden="true">▾</span>
        </button>
      </div>
      <div id="panel-content" class="panel-content">
      <div class="toggles">
        <label class="toggle">
          <input id="text-selection-checkbox" type="checkbox" checked />
          <span>Text selection</span>
        </label>
        <label class="toggle" title="PDF only. Reconstruct stored text with substitute fonts; omit pictures and diagrams. Pages without stored text are blank.">
          <input id="ocr-text-checkbox" type="checkbox" />
          <span>Use OCR text instead of scans</span>
        </label>
        <label id="touch-rotate-row" class="toggle" hidden>
          <input id="touch-rotate-checkbox" type="checkbox" />
          <span>Touch rotate</span>
        </label>
      </div>
      <label class="toggle"><input id="annotation-bubbles-checkbox" type="checkbox" checked /><span>Annotation bubbles</span></label>
      <div id="drawing-selection"></div>
      <div id="pdf-layers"></div>
      <div id="pdf-annotations"></div>
      <div class="number-row search-row">
        <label for="text-search-input">Find Text</label>
        <div class="search-controls">
          <input id="text-search-input" type="search" placeholder="Load a document to search" autocomplete="off" spellcheck="false" disabled />
          <span id="text-search-count" class="search-count" hidden>0/0</span>
          <button id="text-search-prev" type="button" title="Previous match (Shift+Enter)" aria-label="Previous match" disabled>▲</button>
          <button id="text-search-next" type="button" title="Next match (Enter)" aria-label="Next match" disabled>▼</button>
          <button id="text-search-case" type="button" title="Match case" aria-label="Match case" aria-pressed="false" disabled>Aa</button>
        </div>
      </div>
      <div id="page-layout-row" class="number-row" hidden>
        <span id="page-layout-label">Page Layout</span>
        <div class="page-layout-controls">
          <div class="page-layout-buttons" role="group" aria-labelledby="page-layout-label">
            <button type="button" data-page-layout="grid" aria-pressed="true">Grid</button>
            <button type="button" data-page-layout="sphere" aria-pressed="false">Sphere</button>
            <button type="button" data-page-layout="helix" aria-pressed="false">Helix</button>
          </div>
          <span id="page-layout-progress" class="page-layout-progress" role="status" hidden>
            <span class="loader-spinner" aria-hidden="true"></span>
            <progress id="page-layout-progress-bar" max="100" value="0" aria-label="Preparing pages"></progress>
            <span id="page-layout-progress-text">0%</span>
          </span>
        </div>
      </div>
      <div class="number-row">
        <label for="backend-select">Renderer Backend</label>
        <select id="backend-select" aria-label="Renderer backend">
          <option value="webgl" selected>WebGL</option>
          <option value="webgpu">WebGPU</option>
        </select>
      </div>
      <div class="number-row">
        <label for="vector-lod-select">Vector LOD</label>
        <select id="vector-lod-select" aria-label="Vector LOD mode">
          <option value="auto" selected>Auto</option>
          <option value="off">Off</option>
          <option value="force">Force</option>
        </select>
      </div>
      <div class="number-row">
        <label for="text-lod-select">Text LOD</label>
        <select id="text-lod-select" aria-label="Text LOD mode">
          <option value="auto" selected>Auto</option>
          <option value="off">Off</option>
        </select>
      </div>
      <div class="number-row">
        <label for="page-bg-color">Page Background</label>
        <div class="color-controls">
          <input id="page-bg-color" type="color" value="#ffffff" />
          <input id="page-bg-opacity-slider" type="range" min="0" max="100" step="1" value="100" aria-label="Page Background Opacity Slider" />
          <input id="page-bg-opacity" type="number" min="0" max="100" step="1" value="100" aria-label="Page Background Opacity" />
          <span class="color-suffix">%</span>
        </div>
      </div>
      <div class="number-row">
        <label for="vector-color">Vector Override</label>
        <div class="color-controls">
          <input id="vector-color" type="color" value="#000000" />
          <input id="vector-opacity-slider" type="range" min="0" max="100" step="1" value="0" aria-label="Vector Override Opacity Slider" />
          <input id="vector-opacity" type="number" min="0" max="100" step="1" value="0" aria-label="Vector Override Opacity" />
          <span class="color-suffix">%</span>
        </div>
      </div>
      <div id="status" class="row">Waiting for PDF or HEP source.</div>
      <div id="parse-loader" class="row" hidden>
        <span class="loader-spinner" aria-hidden="true"></span>
        <span id="parse-loader-text">0.00% Parsing / loading...</span>
      </div>
      <div class="row meter-row">
        <span class="meter-label">File</span>
        <span id="file-value" class="meter-value">-</span>
      </div>
      <div class="row meter-row">
        <span class="meter-label">Source Segments</span>
        <span id="source-segments-value" class="meter-value">-</span>
      </div>
      <div class="row meter-row">
        <span class="meter-label">Visible Segments</span>
        <span id="visible-segments-value" class="meter-value">-</span>
      </div>
      <div class="row meter-row">
        <span class="meter-label">Parse / Prepare</span>
        <span id="times-value" class="meter-value">-</span>
      </div>
      <div class="row meter-row">
        <span class="meter-label">Zoom</span>
        <span id="zoom-value" class="meter-value">-</span>
      </div>
      <div class="row meter-row">
        <span class="meter-label">FPS</span>
        <span id="fps-value" class="meter-value">-</span>
      </div>
      <div class="row meter-row">
        <span class="meter-label">Draw calls / frame</span>
        <span id="draw-calls-value" class="meter-value">-</span>
      </div>
      <div class="row meter-row">
        <span class="meter-label">Draw</span>
        <span id="draw-stats-value" class="meter-value">-</span>
      </div>
      <div class="row meter-row">
        <span class="meter-label">Vector LOD</span>
        <span id="lod-stats-value" class="meter-value">-</span>
      </div>
      <div class="row meter-row">
        <span class="meter-label">Text LOD</span>
        <span id="text-lod-stats-value" class="meter-value">-</span>
      </div>
      </div>
    </div>

    <div id="drop-indicator">Drop PDF or HEP file to render</div>
    <script type="module" src="/src/three-example.ts"></script>
  </body>
</html>
