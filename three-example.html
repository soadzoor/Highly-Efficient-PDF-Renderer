<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HEPR Three.js Example</title>
    <style>
      :root {
        color-scheme: light;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: #11161d;
        color: #e8edf5;
      }

      #app {
        position: fixed;
        inset: 0;
      }

      #viewport {
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
        cursor: grab;
      }

      #viewport:active {
        cursor: grabbing;
      }

      #panel {
        position: fixed;
        top: 16px;
        left: 16px;
        width: min(620px, calc(100vw - 32px));
        background: rgba(13, 18, 26, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 10px;
        padding: 12px;
        box-sizing: border-box;
        backdrop-filter: blur(8px);
      }

      #panel.collapsed {
        width: auto;
        max-width: calc(100vw - 32px);
      }

      #panel.collapsed .panel-content {
        display: none;
      }

      .panel-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 10px;
      }

      .panel-content {
        margin-top: 8px;
      }

      .row,
      .toolbar,
      .toggles,
      .number-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
      }

      .row:last-child,
      .number-row:last-child {
        margin-bottom: 0;
      }

      select,
      button,
      input {
        font: inherit;
      }

      .toolbar,
      .toggles {
        flex-wrap: wrap;
      }

      .panel-header .toolbar {
        margin-bottom: 0;
      }

      select,
      button {
        background: #162030;
        color: #e8edf5;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 6px;
        padding: 7px 10px;
      }

      button {
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.6;
        cursor: default;
      }

      .chevron-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 30px;
        min-width: 30px;
        height: 30px;
        padding: 0;
        line-height: 1;
      }

      .toggle {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        user-select: none;
      }

      .toggle input {
        margin: 0;
      }

      .number-row {
        display: grid;
        grid-template-columns: max-content minmax(110px, 1fr);
        font-size: 13px;
      }

      .number-row select {
        width: min(220px, 100%);
      }

      .number-row input[type="color"] {
        width: 44px;
        height: 28px;
        padding: 0;
        border-radius: 6px;
      }

      .color-controls {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
      }

      .color-controls input[type="number"] {
        width: 64px;
        min-width: 0;
      }

      .color-controls input[type="range"] {
        width: min(180px, 22vw);
      }

      .color-suffix {
        color: rgba(232, 237, 245, 0.66);
        font-size: 12px;
      }

      #status {
        font-size: 13px;
        opacity: 0.92;
      }

      .meter-row {
        justify-content: space-between;
        font-size: 13px;
        color: rgba(232, 237, 245, 0.88);
      }

      .meter-label {
        color: rgba(232, 237, 245, 0.66);
      }

      .meter-value {
        font-variant-numeric: tabular-nums;
      }

      #parse-loader {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        opacity: 0.94;
      }

      #parse-loader[hidden] {
        display: none !important;
      }

      .row[hidden] {
        display: none !important;
      }

      .toggle[hidden] {
        display: none !important;
      }

      .loader-spinner {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        border: 2px solid rgba(232, 237, 245, 0.25);
        border-top-color: #e8edf5;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <script type="module" crossorigin src="./assets/three-6Xmb0oPA.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/preload-helper-xBbMyY7u.js">
    <link rel="modulepreload" crossorigin href="./assets/vectorStrokeLodStatsFormat-Bz2I3OvB.js">
    <link rel="modulepreload" crossorigin href="./assets/pdf-D9R3BgnU.js">
  </head>
  <body>
    <div id="app">
      <canvas id="viewport"></canvas>
    </div>

    <div id="panel" role="group" aria-label="Three.js HEPR controls">
      <div class="panel-header">
        <div class="toolbar">
          <button id="open-file" type="button">Open PDF / ZIP</button>
          <select id="example-select" aria-label="Load example PDF or parsed ZIP" disabled>
            <option value="">Examples (loading...)</option>
          </select>
          <button id="download-data" type="button" hidden disabled>Download Parsed Data</button>
          <button id="download-pdf" type="button" hidden disabled>Download PDF</button>
          <input id="file-input" type="file" accept=".pdf,.zip,application/pdf,application/zip,application/x-zip-compressed" hidden />
        </div>
        <button id="toggle-panel" class="chevron-button" type="button" aria-expanded="true" aria-controls="panel-content" title="Collapse panel">
          <span id="toggle-panel-icon" aria-hidden="true">▾</span>
        </button>
      </div>
      <div id="panel-content" class="panel-content">
      <div class="toggles">
        <label id="pan-optimization-row" class="toggle" hidden>
          <input id="pan-optimization-checkbox" type="checkbox" checked />
          <span>Pan optimization</span>
        </label>
        <label id="touch-rotate-row" class="toggle" hidden>
          <input id="touch-rotate-checkbox" type="checkbox" />
          <span>Touch rotate</span>
        </label>
      </div>
      <div class="number-row">
        <label for="backend-select">Renderer Backend</label>
        <select id="backend-select" aria-label="Renderer backend">
          <option value="webgl" selected>WebGL</option>
          <option value="webgpu">WebGPU</option>
        </select>
      </div>
      <div class="number-row">
        <label for="vector-lod-select">Vector LOD</label>
        <select id="vector-lod-select" aria-label="Vector LOD mode">
          <option value="auto" selected>Auto</option>
          <option value="off">Off</option>
          <option value="force">Force</option>
        </select>
      </div>
      <div class="number-row">
        <label for="page-bg-color">Page Background</label>
        <div class="color-controls">
          <input id="page-bg-color" type="color" value="#ffffff" />
          <input id="page-bg-opacity-slider" type="range" min="0" max="100" step="1" value="100" aria-label="Page Background Opacity Slider" />
          <input id="page-bg-opacity" type="number" min="0" max="100" step="1" value="100" aria-label="Page Background Opacity" />
          <span class="color-suffix">%</span>
        </div>
      </div>
      <div class="number-row">
        <label for="vector-color">Vector Override</label>
        <div class="color-controls">
          <input id="vector-color" type="color" value="#000000" />
          <input id="vector-opacity-slider" type="range" min="0" max="100" step="1" value="0" aria-label="Vector Override Opacity Slider" />
          <input id="vector-opacity" type="number" min="0" max="100" step="1" value="0" aria-label="Vector Override Opacity" />
          <span class="color-suffix">%</span>
        </div>
      </div>
      <div id="status" class="row">Waiting for PDF or parsed ZIP source.</div>
      <div id="parse-loader" class="row" hidden>
        <span class="loader-spinner" aria-hidden="true"></span>
        <span id="parse-loader-text">Parsing / loading...</span>
      </div>
      <div class="row meter-row">
        <span class="meter-label">File</span>
        <span id="file-value" class="meter-value">-</span>
      </div>
      <div class="row meter-row">
        <span class="meter-label">Source Segments</span>
        <span id="source-segments-value" class="meter-value">-</span>
      </div>
      <div class="row meter-row">
        <span class="meter-label">Visible Segments</span>
        <span id="visible-segments-value" class="meter-value">-</span>
      </div>
      <div class="row meter-row">
        <span class="meter-label">Parse / Upload</span>
        <span id="times-value" class="meter-value">-</span>
      </div>
      <div class="row meter-row">
        <span class="meter-label">FPS</span>
        <span id="fps-value" class="meter-value">-</span>
      </div>
      <div class="row meter-row">
        <span class="meter-label">Draw</span>
        <span id="draw-stats-value" class="meter-value">-</span>
      </div>
      <div class="row meter-row">
        <span class="meter-label">Vector LOD</span>
        <span id="lod-stats-value" class="meter-value">-</span>
      </div>
      </div>
    </div>

  </body>
</html>
