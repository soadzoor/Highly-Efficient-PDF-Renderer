name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Validate release version and changelog
        run: node scripts/changelog.mjs check --released --tag "$GITHUB_REF_NAME"

      - name: Prepare release notes
        env:
          RELEASE_NOTES_FILE: ${{ runner.temp }}/hepr-release-notes.md
        run: node scripts/changelog.mjs notes --tag "$GITHUB_REF_NAME" --output "$RELEASE_NOTES_FILE"

      - name: Check whether this version is already published
        id: registry
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';

          const { name, version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const npmTag = version.split('+', 1)[0].includes('-') ? 'next' : 'latest';
          appendFileSync(process.env.GITHUB_OUTPUT, `npm-tag=${npmTag}\n`);
          const endpoint = `https://registry.npmjs.org/${encodeURIComponent(name)}/${encodeURIComponent(version)}`;
          const response = await fetch(endpoint, { signal: AbortSignal.timeout(30_000) });
          if (response.status === 404) {
            appendFileSync(process.env.GITHUB_OUTPUT, 'already-published=false\n');
          } else {
            if (!response.ok) {
              throw new Error(`npm registry check failed: HTTP ${response.status}`);
            }
            const published = await response.json();
            const commit = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
            if (published.name !== name || published.version !== version || published.gitHead !== commit) {
              throw new Error(`${name}@${version} already exists but does not identify this release commit; refusing to skip publication.`);
            }
            console.log(`${name}@${version} was already published from ${commit}; retrying GitHub Release notes.`);
            appendFileSync(process.env.GITHUB_OUTPUT, 'already-published=true\n');
          }
          NODE

      - name: Install dependencies
        if: steps.registry.outputs.already-published != 'true'
        run: npm install

      - name: Publish package
        if: steps.registry.outputs.already-published != 'true'
        env:
          NPM_DIST_TAG: ${{ steps.registry.outputs.npm-tag }}
        run: npm publish --access public --tag "$NPM_DIST_TAG"

      - name: Create or update GitHub Release notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES_FILE: ${{ runner.temp }}/hepr-release-notes.md
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';

          const tag = process.env.GITHUB_REF_NAME;
          const repository = process.env.GITHUB_REPOSITORY;
          const endpoint = `${process.env.GITHUB_API_URL}/repos/${repository}/releases/tags/${encodeURIComponent(tag)}`;
          const response = await fetch(endpoint, {
            headers: {
              Accept: 'application/vnd.github+json',
              Authorization: `Bearer ${process.env.GH_TOKEN}`,
              'X-GitHub-Api-Version': '2022-11-28',
            },
            signal: AbortSignal.timeout(30_000),
          });
          const args = ['release'];
          if (response.ok) {
            args.push('edit', tag);
          } else if (response.status === 404) {
            args.push('create', tag, '--verify-tag', '--title', tag);
            if (tag.split('+', 1)[0].includes('-')) args.push('--prerelease');
          } else {
            throw new Error(`GitHub Release lookup failed: HTTP ${response.status}`);
          }
          args.push('--repo', repository, '--notes-file', process.env.RELEASE_NOTES_FILE);
          execFileSync('gh', args, { stdio: 'inherit' });
          NODE
