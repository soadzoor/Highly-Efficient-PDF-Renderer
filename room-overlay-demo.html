<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HEPR Room Overlay Demo</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #a0a9af;
      }

      #viewport {
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
        cursor: grab;
      }

      #viewport:active {
        cursor: grabbing;
      }

      #panel {
        position: fixed;
        top: 16px;
        left: 16px;
        width: min(520px, calc(100vw - 32px));
        max-height: calc(100vh - 32px);
        overflow-y: auto;
        padding: 12px;
        border: 1px solid rgba(15, 23, 42, 0.16);
        border-radius: 8px;
        background: rgba(250, 251, 252, 0.92);
        box-shadow: 0 8px 22px rgba(15, 23, 42, 0.12);
        backdrop-filter: blur(6px);
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      button,
      select {
        min-height: 34px;
        border-radius: 8px;
        font: inherit;
        font-size: 0.9rem;
      }

      button {
        border: 1px solid #0f172a;
        padding: 7px 12px;
        background: #111827;
        color: #f9fafb;
        cursor: pointer;
      }

      button:hover {
        background: #1f2937;
      }

      button:disabled,
      select:disabled {
        opacity: 0.55;
        cursor: default;
      }

      select {
        border: 1px solid rgba(15, 23, 42, 0.5);
        padding: 6px 10px;
        background: #ffffff;
        color: #0f172a;
      }

      .status {
        margin-top: 10px;
        color: #1f2937;
        font-size: 0.88rem;
        line-height: 1.35;
      }

      .metrics {
        margin-top: 10px;
        border: 1px solid rgba(15, 23, 42, 0.12);
        border-radius: 8px;
        padding: 8px 10px;
        background: rgba(255, 255, 255, 0.72);
      }

      .metric-row {
        display: grid;
        grid-template-columns: minmax(90px, 120px) 1fr;
        gap: 10px;
        align-items: baseline;
      }

      .metric-row + .metric-row {
        margin-top: 4px;
      }

      .metric-label {
        color: #475569;
        font-size: 0.8rem;
      }

      .metric-value {
        color: #0f172a;
        font-family: "IBM Plex Mono", "Cascadia Mono", monospace;
        font-size: 0.81rem;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <canvas id="viewport"></canvas>
    <div id="panel">
      <div class="toolbar">
        <button id="load-files" type="button">Load PDF + TSV</button>
        <button id="clear-tsv" type="button" disabled>Clear TSV</button>
        <input id="file-input" type="file" accept=".pdf,.tsv,application/pdf,text/tab-separated-values,text/plain" multiple hidden />
      </div>
      <div id="status" class="status">Load a PDF to begin.</div>
      <div class="metrics">
        <div class="metric-row"><span class="metric-label">PDF</span><span id="pdf-value" class="metric-value">-</span></div>
        <div class="metric-row"><span class="metric-label">TSV</span><span id="tsv-value" class="metric-value">-</span></div>
        <div class="metric-row"><span class="metric-label">Rooms</span><span id="rooms-value" class="metric-value">-</span></div>
      </div>
    </div>
    <script type="module" src="/src/room-overlay-demo.ts"></script>
  </body>
</html>
