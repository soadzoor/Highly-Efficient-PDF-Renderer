<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HEPR Room Overlay Demo</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #a0a9af;
      }

      #viewport {
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
        cursor: grab;
      }

      #viewport:active {
        cursor: grabbing;
      }

      #room-label-layer {
        position: fixed;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        overflow: hidden;
      }

      .room-label-pill {
        position: fixed;
        left: 0;
        top: 0;
        display: inline-flex;
        flex-direction: column;
        align-items: center;
        max-width: min(170px, 28vw);
        padding: 3px 7px 4px;
        border: 1px solid var(--room-label-color, #f59e0b);
        border-radius: 4px;
        background: rgba(8, 13, 20, 0.86);
        box-shadow: 0 2px 8px rgba(15, 23, 42, 0.22);
        color: rgba(255, 255, 255, 0.97);
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
        font-size: 11px;
        font-weight: 700;
        line-height: 1.1;
        text-align: center;
        white-space: nowrap;
        transform: translate3d(-9999px, -9999px, 0);
        user-select: none;
        will-change: transform;
      }

      .room-label-pill span {
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .room-label-pill span + span {
        margin-top: 1px;
        font-size: 10px;
        font-weight: 650;
        opacity: 0.92;
      }

      .room-label-pill.hide-room-number .room-label-number {
        display: none;
      }

      .room-label-pill.hide-room-text span:not(.room-label-number) {
        display: none;
      }

      /* With the number hidden, the line after it becomes the pill's first
         visible line and takes over the primary styling. */
      .room-label-pill.hide-room-number .room-label-number + span {
        margin-top: 0;
        font-size: 11px;
        font-weight: 700;
        opacity: 1;
      }

      #panel {
        position: fixed;
        top: 16px;
        left: 16px;
        z-index: 2;
        width: min(520px, calc(100vw - 32px));
        max-height: calc(100vh - 32px);
        overflow-y: auto;
        padding: 12px;
        border: 1px solid rgba(15, 23, 42, 0.16);
        border-radius: 8px;
        background: rgba(250, 251, 252, 0.92);
        box-shadow: 0 8px 22px rgba(15, 23, 42, 0.12);
        backdrop-filter: blur(6px);
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      button,
      select {
        min-height: 34px;
        border-radius: 8px;
        font: inherit;
        font-size: 0.9rem;
      }

      button {
        border: 1px solid #0f172a;
        padding: 7px 12px;
        background: #111827;
        color: #f9fafb;
        cursor: pointer;
      }

      button:hover {
        background: #1f2937;
      }

      button:disabled,
      select:disabled,
      input:disabled {
        opacity: 0.55;
        cursor: default;
      }

      select {
        border: 1px solid rgba(15, 23, 42, 0.5);
        padding: 6px 10px;
        background: #ffffff;
        color: #0f172a;
      }

      .status {
        margin-top: 10px;
        color: #1f2937;
        font-size: 0.88rem;
        line-height: 1.35;
      }

      .toggles {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 10px;
      }

      .toggle {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        color: #1f2937;
        font-size: 0.86rem;
        user-select: none;
      }

      .toggle input {
        width: 15px;
        height: 15px;
        margin: 0;
      }

      .metrics {
        margin-top: 10px;
        border: 1px solid rgba(15, 23, 42, 0.12);
        border-radius: 8px;
        padding: 8px 10px;
        background: rgba(255, 255, 255, 0.72);
      }

      .metric-row {
        display: grid;
        grid-template-columns: minmax(90px, 120px) 1fr;
        gap: 10px;
        align-items: baseline;
      }

      .metric-row + .metric-row {
        margin-top: 4px;
      }

      .metric-label {
        color: #475569;
        font-size: 0.8rem;
      }

      .metric-value {
        color: #0f172a;
        font-family: "IBM Plex Mono", "Cascadia Mono", monospace;
        font-size: 0.81rem;
        word-break: break-word;
      }

      #detect-rooms {
        display: inline-flex;
        align-items: center;
      }

      .button-spinner {
        width: 13px;
        height: 13px;
        margin-left: 8px;
        border: 2px solid rgba(249, 250, 251, 0.35);
        border-top-color: #f9fafb;
        border-radius: 50%;
        animation: spinner-rotate 0.8s linear infinite;
      }

      .button-spinner[hidden] {
        display: none;
      }

      @keyframes spinner-rotate {
        to {
          transform: rotate(360deg);
        }
      }

      .example-dropdown {
        position: relative;
      }

      .example-trigger {
        display: inline-flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        min-width: 160px;
        max-width: 100%;
        border: 1px solid rgba(15, 23, 42, 0.35);
        background: #ffffff;
        color: #0f172a;
        border-radius: 8px;
        padding: 7px 12px;
        font: inherit;
        font-size: 0.88rem;
        cursor: pointer;
        transition: border-color 120ms ease, box-shadow 120ms ease, background 120ms ease;
      }

      .example-trigger:hover {
        background: #f8fafc;
        border-color: rgba(15, 23, 42, 0.55);
      }

      .example-trigger:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        pointer-events: auto;
      }

      .example-dropdown.open .example-trigger {
        border-color: rgba(37, 99, 235, 0.65);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.16);
      }

      .example-trigger-label {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .example-trigger-count {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 20px;
        height: 20px;
        padding: 0 6px;
        border-radius: 999px;
        background: rgba(15, 23, 42, 0.08);
        color: #334155;
        font-size: 0.72rem;
        font-weight: 600;
        line-height: 1;
      }

      .example-trigger-chevron {
        color: #64748b;
        font-size: 0.8rem;
        line-height: 1;
        transition: transform 140ms ease;
      }

      .example-dropdown.open .example-trigger-chevron {
        transform: rotate(180deg);
      }

      .example-menu {
        position: fixed;
        z-index: 40;
        width: max-content;
        max-width: min(460px, calc(100vw - 32px));
        padding: 6px;
        overflow-y: auto;
        background: rgba(255, 255, 255, 0.97);
        border: 1px solid rgba(15, 23, 42, 0.14);
        border-radius: 12px;
        box-shadow: 0 12px 32px rgba(15, 23, 42, 0.2);
        backdrop-filter: blur(8px);
        outline: none;
        animation: menu-pop 120ms ease-out;
      }

      .example-menu[hidden] {
        display: none;
      }

      @keyframes menu-pop {
        from {
          opacity: 0;
          transform: translateY(-4px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .example-menu-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 6px 10px;
        border-radius: 8px;
      }

      .example-menu-row:hover {
        background: rgba(15, 23, 42, 0.05);
      }

      .example-menu-name {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: #0f172a;
        font-size: 0.86rem;
      }

      .example-menu-actions {
        display: inline-flex;
        flex-shrink: 0;
        gap: 6px;
      }

      .example-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1px solid rgba(15, 23, 42, 0.18);
        background: rgba(255, 255, 255, 0.9);
        color: #0f172a;
        border-radius: 999px;
        padding: 3px 10px;
        font: inherit;
        font-size: 0.76rem;
        line-height: 1.3;
        cursor: pointer;
        transition: background 100ms ease, color 100ms ease, border-color 100ms ease;
      }

      .example-chip:hover,
      .example-chip:focus-visible {
        background: #111827;
        border-color: #111827;
        color: #f9fafb;
      }

      .example-chip-kind {
        font-weight: 600;
      }

      .example-chip-size {
        color: #64748b;
        font-family: "IBM Plex Mono", "Cascadia Mono", monospace;
        font-size: 0.72rem;
      }

      .example-chip:hover .example-chip-size,
      .example-chip:focus-visible .example-chip-size {
        color: #cbd5e1;
      }
    </style>
    <script type="module" crossorigin src="./assets/roomOverlay-DL9Mi7ne.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/preload-helper-HclGiUj8.js">
    <link rel="modulepreload" crossorigin href="./assets/textSelection-oKruHYwv.js">
    <link rel="modulepreload" crossorigin href="./assets/pdf-BrkPXbfk.js">
    <link rel="modulepreload" crossorigin href="./assets/src-CXtgK6Sj.js">
  </head>
  <body>
    <canvas id="viewport"></canvas>
    <div id="room-label-layer" aria-hidden="true"></div>
    <div id="panel">
      <div class="toolbar">
        <button id="load-files" type="button">Load PDF/ZIP + TSV</button>
        <div id="example-dropdown" class="example-dropdown">
          <button id="example-select" class="example-trigger" type="button" aria-label="Load example PDF" aria-haspopup="true" aria-expanded="false" aria-controls="example-menu" disabled>
            <span id="example-select-label" class="example-trigger-label">Examples (loading...)</span>
            <span class="example-trigger-chevron" aria-hidden="true">▾</span>
          </button>
          <div id="example-menu" class="example-menu" hidden></div>
        </div>
        <button id="detect-rooms" type="button" disabled>
          <span id="detect-rooms-label">Detect Rooms</span>
          <span id="detect-rooms-spinner" class="button-spinner" hidden aria-hidden="true"></span>
        </button>
        <button id="download-generated-tsv" type="button" disabled>Download Generated TSV</button>
        <button id="clear-tsv" type="button" disabled>Clear TSV</button>
        <input id="file-input" type="file" accept=".pdf,.zip,.tsv,application/pdf,application/zip,text/tab-separated-values,text/plain" multiple hidden />
      </div>
      <div class="toggles">
        <label class="toggle">
          <input id="show-rooms" type="checkbox" checked disabled />
          <span>Show rooms</span>
        </label>
        <label class="toggle">
          <input id="show-room-labels" type="checkbox" checked disabled />
          <span>Show labels</span>
        </label>
        <label class="toggle">
          <input id="show-room-numbers" type="checkbox" checked disabled />
          <span>Room numbers</span>
        </label>
      </div>
      <div id="status" class="status">Load a PDF or parsed ZIP to begin.</div>
      <div class="metrics">
        <div class="metric-row"><span class="metric-label">PDF</span><span id="pdf-value" class="metric-value">-</span></div>
        <div class="metric-row"><span class="metric-label">TSV</span><span id="tsv-value" class="metric-value">-</span></div>
        <div class="metric-row"><span class="metric-label">Rooms</span><span id="rooms-value" class="metric-value">-</span></div>
      </div>
    </div>
  </body>
</html>
