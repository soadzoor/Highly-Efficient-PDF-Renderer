  <body>
    <div class="viewer-workspace viewer-workspace-root">
      <div class="viewer-document">
        <canvas id="viewport"></canvas>
        <div id="room-label-layer" aria-hidden="true"></div>
      </div>
      <div id="panel" class="viewer-settings">
        <div class="toolbar">
          <a class="package-version" href="https://www.npmjs.com/package/@soadzoor/hepr" target="_blank" rel="noopener noreferrer" title="HEPR package version used by this build">npm v0.2.2</a>
          <button id="load-files" type="button" title="Open a PDF or HEPR-exported .hep file, optionally with a TSV">Load PDF/HEP + TSV</button>
          <div id="example-dropdown" class="example-dropdown">
            <button id="example-select" class="example-trigger" type="button" aria-label="Load example PDF or HEP file" aria-haspopup="true" aria-expanded="false" aria-controls="example-menu" disabled>
              <span id="example-select-label" class="example-trigger-label">Examples (loading...)</span>
              <span class="example-trigger-chevron" aria-hidden="true">▾</span>
            </button>
            <div id="example-menu" class="example-menu" hidden></div>
          </div>
          <button id="detect-rooms" type="button" disabled>
            <span id="detect-rooms-label">Detect Rooms</span>
            <span id="detect-rooms-spinner" class="button-spinner" hidden aria-hidden="true"></span>
          </button>
          <button id="download-generated-tsv" type="button" disabled>Download Generated TSV</button>
          <button id="clear-tsv" type="button" disabled>Clear TSV</button>
          <input id="file-input" type="file" accept=".pdf,.hep,.tsv,application/pdf,application/x-hep,text/tab-separated-values,text/plain" multiple hidden />
        </div>
        <div class="toggles">
          <label class="toggle">
            <input id="show-rooms" type="checkbox" checked disabled />
            <span>Show rooms</span>
          </label>
          <label class="toggle">
            <input id="show-room-labels" type="checkbox" checked disabled />
            <span>Show labels</span>
          </label>
          <label class="toggle">
            <input id="show-room-numbers" type="checkbox" checked disabled />
            <span>Room numbers</span>
          </label>
        </div>
        <label class="toggle"><input id="annotation-bubbles-checkbox" type="checkbox" checked /><span>Annotation bubbles</span></label>
        <div id="drawing-selection"></div>
        <div id="pdf-layers"></div>
        <div id="pdf-annotations"></div>
        <div id="status" class="status">Load a PDF or HEP file to begin.</div>
        <div class="metrics">
          <div class="metric-row"><span class="metric-label">Source</span><span id="pdf-value" class="metric-value">-</span></div>
          <div class="metric-row"><span class="metric-label">TSV</span><span id="tsv-value" class="metric-value">-</span></div>
          <div class="metric-row"><span class="metric-label">Rooms</span><span id="rooms-value" class="metric-value">-</span></div>
          <div class="metric-row"><span class="metric-label">Zoom</span><span id="zoom-value" class="metric-value">-</span></div>
          <div class="metric-row"><span class="metric-label">Draw calls / frame</span><span id="draw-calls-value" class="metric-value">-</span></div>
        </div>
      </div>
    </div>
